<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练习使用多用电表 · 从一只表头到六个档位</title>
<style>
  /* C 基调 · 白底实物风格（风格与技术路线.md v4.0） */
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,'Microsoft YaHei','PingFang SC',sans-serif;
    background:linear-gradient(135deg,#f5f7fa 0%,#e4edf9 100%);
    color:#333; overflow:hidden;
  }
  .app{display:grid;grid-template-rows:auto auto 1fr auto auto;height:100vh;padding:8px 12px 10px;gap:7px;}
  header{background:rgba(255,255,255,.95);border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);padding:8px 16px;display:flex;align-items:center;gap:12px;
    flex-wrap:nowrap;height:44px;flex:0 0 auto;overflow:hidden;}
  header h1{font-size:1rem;color:#2c3e50;font-weight:600;white-space:nowrap;}
  .act{font-size:.74rem;color:#3498db;background:#eef5fd;border:1px solid #d7e5f7;border-radius:20px;padding:2px 10px;white-space:nowrap;}
  .steptitle{font-size:.88rem;color:#37474f;font-weight:600;flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stepsn{flex:0 0 auto;margin-left:auto;font-size:.8rem;color:#90a4ae;font-variant-numeric:tabular-nums;}
  .topnav{display:flex;align-items:center;gap:4px;padding:5px 10px;overflow-x:auto;overflow-y:hidden;
    background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .topnav .grouplab{flex:0 0 auto;font-size:.68rem;letter-spacing:.3px;color:#90a4ae;font-weight:600;white-space:nowrap;}
  .topnav .sep{flex:0 0 auto;width:1px;height:14px;background:#e0e7ef;margin:0 4px;}
  .topnav a{flex:0 0 auto;min-width:24px;height:21px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;
    font-size:.74rem;font-variant-numeric:tabular-nums;color:#546e7a;background:#f8fafd;
    border:1px solid #e0e7ef;border-radius:6px;cursor:pointer;text-decoration:none;}
  .topnav a:hover{border-color:#3498db;background:#f1f7ff;}
  .topnav a.on{background:#3498db;border-color:#3498db;color:#fff;font-weight:700;}
  .stage{display:grid;grid-template-columns:1fr 302px;gap:7px;min-height:0;}
  .canvaswrap{position:relative;min-width:0;min-height:0;padding:5px;background:#fff;border-radius:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none;
    background:linear-gradient(to bottom,#f0f5fc,#ffffff);border-radius:8px;
    box-shadow:inset 0 0 10px rgba(0,0,0,.08);}
  aside{background:#fff;border-radius:15px;box-shadow:0 8px 25px rgba(0,0,0,.08);
    padding:11px 13px;overflow-y:auto;min-height:0;}
  aside h3{font-size:.74rem;color:#90a4ae;margin:10px 0 5px;font-weight:600;letter-spacing:.3px;}
  aside h3:first-child{margin-top:0;}
  .rd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 0;
    font-size:.78rem;color:#546e7a;border-bottom:1px dashed #e0e7ef;}
  .rd span{white-space:nowrap;}
  .rd b{font-size:.9rem;color:#297fb8;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
    font-family:'Courier New',monospace;}
  .rd b.red{color:#c0392b;} .rd b.green{color:#27ae60;} .rd b.grey{color:#78909c;} .rd b.orange{color:#e67e22;} .rd b.ink{color:#546e7a;}
  .total{margin-top:8px;padding:9px 11px;background:#DCDCDC;border:1px solid #e9f0f9;
    border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,.04);text-align:center;}
  .total .lab{font-size:.72rem;color:#546e7a;display:block;margin-bottom:2px;}
  .total b{font-size:1.55rem;color:#297fb8;font-weight:700;font-family:'Courier New',monospace;
    font-variant-numeric:tabular-nums;}
  .formula{font-size:.8rem;color:#1565c0;background:#eef5fd;border:1px solid #d7e5f7;
    border-radius:8px;padding:8px 10px;line-height:1.6;word-break:break-word;}
  .note{font-size:.78rem;color:#37474f;line-height:1.68;}
  .note b{color:#c0392b;font-weight:600;}
  .rules{display:flex;flex-direction:column;gap:5px;}
  .rules div{font-size:.76rem;color:#37474f;background:#f8fafd;border-left:3px solid #3498db;
    border-radius:0 6px 6px 0;padding:5px 8px;line-height:1.5;}
  .fillrow{margin-bottom:6px;}
  .fillrow label{display:block;font-size:.74rem;color:#546e7a;margin-bottom:3px;}
  .fillrow input{width:100%;font-family:'Courier New',monospace;font-size:.92rem;
    font-variant-numeric:tabular-nums;color:#297fb8;background:#fff;
    border:1px solid #dde2e9;border-radius:8px;padding:6px 9px;outline:none;}
  .fillrow input:focus{border-color:#3498db;}
  .fmsg{font-size:.72rem;margin-top:3px;color:#546e7a;}
  .fmsg.ok{color:#27ae60;} .fmsg.bad{color:#c0392b;}
  .grp{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .grp .lab{font-size:.74rem;color:#90a4ae;white-space:nowrap;}
  button{font-family:inherit;font-size:.76rem;color:#fff;font-weight:500;
    background:#3498db;border:none;border-radius:8px;padding:5px 12px;cursor:pointer;

  button:hover{background:#2980b9;transform:translateY(-1px);box-shadow:0 4px 8px rgba(52,152,219,.25);}

  button.ghost{background:#fff;color:#546e7a;border:1px solid #dde2e9;}
  button.ghost:hover{background:#f1f7ff;border-color:#3498db;box-shadow:none;}
  button.on{background:#2980b9;box-shadow:0 0 0 2px rgba(52,152,219,.3);}
  .hint{padding:6px 14px;font-size:.8rem;color:#1565c0;background:rgba(240,248,255,.9);
    border:1px solid #d7e5f7;border-radius:15px;height:32px;flex:0 0 auto;overflow:hidden;
    display:flex;align-items:center;white-space:nowrap;text-overflow:ellipsis;}
  .hint b{color:#3498db;font-weight:600;}
  footer{display:flex;align-items:center;gap:7px;flex-wrap:wrap;row-gap:6px;
    padding:7px 12px;background:#fff;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);}
  #ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:6px;flex:1 1 100%;}
  .bar{position:relative;flex:1 1 90px;min-width:60px;height:8px;background:#e0e7ef;border-radius:4px;}
  .bar i{display:block;height:100%;width:0;background:#3498db;border-radius:4px;transition:width .2s;}
  .slider{display:flex;align-items:center;gap:6px;font-size:.78rem;color:#546e7a;}
  .slider input[type=range]{width:112px;height:8px;background:#e0e7ef;border-radius:4px;
    outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;}
  .slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;
    border-radius:50%;background:#3498db;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .slider input[type=range]::-moz-range-thumb{width:19px;height:19px;border:none;border-radius:50%;
    background:#3498db;cursor:pointer;}
  .slider b{color:#297fb8;font-variant-numeric:tabular-nums;min-width:58px;text-align:right;
    font-family:'Courier New',monospace;}
  #dragLab{font-size:.72rem;color:#90a4ae;}
  #dragLab.dim{opacity:.45;}
  .hidden{display:none !important;}
  @media (max-width:900px){
    .stage{grid-template-columns:1fr;grid-template-rows:1fr auto;}
    aside{max-height:25vh;border-radius:12px;}
    .app{padding:5px 7px 7px;gap:5px;}
    header{height:38px;padding:5px 9px;gap:7px;} header h1{font-size:.78rem;} .steptitle{font-size:.72rem;} .act{font-size:.66rem;padding:1px 7px;}
    .hint{height:42px;white-space:normal;line-height:1.4;font-size:.72rem;padding:5px 9px;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .slider input[type=range]{width:74px;}
    footer{flex-wrap:wrap;} #ctrls{gap:7px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>多用电表 · 从表头到六个档位</h1>
    <span class="act" id="actTag">第 0 幕</span>
    <span class="steptitle" id="stepTitle">—</span>
    <span class="stepsn" id="stepSn">1 / 33</span>
  </header>

  <nav class="topnav" id="toc" aria-label="步骤导航"></nav>

  <div class="stage">
    <div class="canvaswrap"><canvas id="cv"></canvas></div>
    <aside>
      <h3>这一刻的量</h3>
      <div id="p1"></div>
      <h3>这一挡的参数</h3>
      <div id="p2"></div>
      <div class="total"><span class="lab" id="rdTotalLab">本步读数 / 结论</span><b id="rdTotal">—</b></div>

      <div id="fillPane" class="hidden">
        <h3>填一填</h3>
        <div id="fillFields"></div>
        <div class="grp" style="margin-top:6px">
          <button id="btnFillCheck">对答案</button>
        </div>
      </div>

      <div id="rulePane" class="hidden">
        <h3>规则卡</h3>
        <div class="rules" id="rules"></div>
      </div>

      <h3>这一刻的公式</h3>
      <div class="formula" id="rdFormula">—</div>
      <h3>说明</h3>
      <div class="note" id="rdNote"></div>
    </aside>
  </div>

  <div class="hint" id="hint"></div>

  <footer>
    <button id="btnPrev" class="ghost">◀ 上一步</button>
    <button id="btnNext">下一步 ▶</button>
    <button id="btnReset" class="ghost">↺ 复位本步</button>
    <div class="bar" id="prog"><i></i></div>
    <span id="dragLab">—</span>
    <div id="ctrls"></div>
  </footer>
</div>

<script>


window.VizPhys4 = (function () {
'use strict';

var IG = 1e-3;
var RG = 100;
var UG = IG * RG;

var U1 = 2.5, U2 = 10;
var IA = 0.1, IB = 0.01;
var M1 = 100, M2 = 1000;
var E1 = 1.5;
var E2 = 15;
var MID = 15;
var DF = 0.004;

var DIV_WHITE = [1, 0.1, 0.01, 2, 0.2, 0.02, 5, 0.5, 0.05];
var DIV_TABLE = { '1': [0.02, 50], '2.5': [0.05, 50], '3': [0.1, 30], '10': [0.2, 50], '15': [0.5, 30], '50': [1, 50], '250': [5, 50] };
var ROW_V = [250, 50, 10];

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function near(a, b, t) { return Math.abs(a - b) <= (t == null ? 1e-9 : t); }
function fmt(v, n) {
var t = Number(v).toFixed(n == null ? 3 : n);
if (t.indexOf('.') >= 0) { t = t.replace(/0+$/, '').replace(/\.$/, ''); }
return t;
}
function inList(v, list, t) {
for (var i = 0; i < list.length; i++) { if (Math.abs(list[i] - v) <= (t || 1e-9)) { return true; } }
return false;
}

function headState(I, opt) {
opt = opt || {};
var Ig = opt.Ig == null ? IG : opt.Ig, Rg = opt.Rg == null ? RG : opt.Rg;
var f = I / Ig;
var reverse = f < -1e-12;
return {
I: I, f: f, fShow: reverse ? 0 : clamp(f, 0, 1), U: I * Rg, times: f,
overload: f > 1 + 1e-9, reverse: reverse, needle: reverse ? -0.02 : clamp(f, -0.02, 1.02)
};
}
function timesFull(U) { return U / UG; }

function recommendRange(measured, std) {
for (var i = 0; i < std.length; i++) { if (std[i] >= 2 * measured - 1e-12) { return std[i]; } }
return std[std.length - 1];
}
function recommendReason(measured, std) {
var r = recommendRange(measured, std);
return { range: r, usable: measured / r, atMiddle: measured / r >= 0.33 && measured / r <= 0.67, text: measured + ' 落在 ' + r + ' 挡的 ' + Math.round(measured / r * 100) + '% 处' };
}

function seriesR(U, Rg) { return U / IG - (Rg == null ? RG : Rg); }
function voltRV(U) { return U / IG; }

function shuntR(I, Rg) { return IG * (Rg == null ? RG : Rg) / (I - IG); }
function ampRA(I) { var R = shuntR(I); return RG * R / (RG + R); }

function shuntPair(Ibig, Ismall, Rg) {
var g = Rg == null ? RG : Rg;
var S = IG * g / (Ismall - IG);
var Ra = IG * (g + S) / Ibig;
return { S: S, Ra: Ra, Rb: S - Ra };
}

function voltTaps(list) {
var out = [], i, prev = 0;
for (i = 0; i < list.length; i++) {
var tot = list[i] / IG - RG;
out.push({ U: list[i], total: tot, seg: tot - prev, RV: list[i] / IG });
prev = tot;
}
return out;
}

function scaleValueOf(f, range) { return clamp(f, -0.02, 1.02) * range; }
function divFamily(div) {
var d = Math.abs(div), m;
if (d === 0) { return null; }
while (d < 1) { d *= 10; }
while (d >= 10) { d /= 10; }
m = Math.round(d * 1e6) / 1e6;
if (near(m, 1, 1e-6)) { return '十分法'; }
if (near(m, 2, 1e-6)) { return '二分法'; }
if (near(m, 5, 1e-6)) { return '五分法'; }
return null;
}
function checkDiv(div) { return inList(div, DIV_WHITE, 1e-9) && divFamily(div) !== null; }
function estStep(div) {
var fam = divFamily(div);
if (fam === '十分法') { return div / 10; }
if (fam === '二分法') { return div / 2; }
if (fam === '五分法') { return div / 5; }
return div / 5;
}
function decimalsOf(step) {
if (step >= 1) { return 0; }
if (step >= 0.1) { return 1; }
if (step >= 0.01) { return 2; }
return 3;
}
function readUniform(f, range, div) {
var v = clamp(f, 0, 1) * range, step = estStep(div), dec = decimalsOf(step);
return { value: v, shown: (Math.round(v / step) * step).toFixed(dec), dec: dec, step: step, div: div, family: divFamily(div) };
}
function divOf(range) {
var e = DIV_TABLE[String(range)];
if (e) { return { div: e[0], cells: e[1] }; }
var cand = [10, 5, 2, 1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01], i;
for (i = 0; i < cand.length; i++) { if (range / cand[i] >= 20 && range / cand[i] <= 60) { return { div: cand[i], cells: Math.round(range / cand[i]) }; } }
return { div: range / 50, cells: 50 };
}
function rowValues(f) { return [f * ROW_V[0], f * ROW_V[1], f * ROW_V[2]]; }

function polarity(mode) {
if (mode === 'ohm') {
return { redHigher: false, blackHigher: true, currentIn: 'red', rule: '红进黑出',
path: ['表内电池正极', '黑表笔', '待测电阻 Rx', '红表笔', '表头 G', '电池负极'],
note: '对外看电流仍从红笔流入表头；对内看电池正极接在黑笔上 —— 所以黑笔电势高' };
}
return { redHigher: true, blackHigher: false, currentIn: 'red', rule: '红进黑出',
path: ['红表笔（高电势）', '表头 G', '黑表笔（低电势）'], note: '电流从红表笔流入表头，指针正向偏转' };
}
function circuitState(opt) {
opt = opt || {};
var n = opt.probes == null ? 2 : opt.probes;
if (n < 2 || opt.open) { return { closed: false, I: 0, f: 0, reverse: false, note: '只有一根表笔，回路没闭合' }; }
var hs = headState(opt.swapped ? -Math.abs(opt.I || 0) : (opt.I || 0));
return { closed: true, I: hs.I, f: hs.f, fShow: hs.fShow, reverse: hs.reverse, note: '' };
}
function probePotentials(mode, U, Ebat) {
if (mode === 'ohm') { var e = Ebat == null ? E1 : Ebat; return { red: 0, black: e }; }
return { red: U || 0, black: 0 };
}
function diodeTest(dir, Rf, Rb) {
var fwd = (dir === 'forward'), R = fwd ? (Rf == null ? 300 : Rf) : (Rb == null ? 100000 : Rb);
var rd = ohmRead(R, M1, 1);
return { dir: dir, Rx: R, f: rd.f, read: rd.read, small: fwd, ratio: (Rb == null ? 100000 : Rb) / (Rf == null ? 300 : Rf) };
}

function ohmRint(mult) { return MID * mult; }
function ohmE(mult) { return IG * ohmRint(mult); }
function ohmIfs(mult) { return ohmE(mult) / ohmRint(mult); }
function ohmR0(mult) { return ohmRint(mult) - RG; }
function ohmFrac(Rx, mult, zero) {
var R = ohmRint(mult), z = (zero == null ? 1 : zero);
return clamp(z * R / (R + Math.max(0, Rx)), 0, 1.02);
}
function ohmScale(f, mid) {
var m = (mid == null ? MID : mid);
if (f >= 1) { return 0; }
var fp = Math.max(1e-6, f), v = m * (1 - fp) / fp;
return v > 1e7 ? Infinity : v;
}
function ohmScaleOf(mult, f) { return ohmScale(f, MID); }
function ohmRead(Rx, mult, zero) {
var f = ohmFrac(Rx, mult, zero), sc = ohmScaleOf(mult, f);
return { f: f, scale: sc, read: sc * mult, mult: mult, Rint: ohmRint(mult) };
}
function ohmRxOfF(f, Rint) { return Rint * (1 - f) / f; }
function ohmErr(f) { var fp = clamp(f, 0.004, 0.995); return DF / (fp * (1 - fp)); }
var OHM_SEVEN = [1.0, 0.9, 0.75, 0.5, 0.25, 0.1, 0.02];
function mechOffset(screw) { return clamp(screw, -1, 1) * 0.06; }
function mechRead(Rx, mult, zero, screw) {
var R = ohmRint(mult), z = (zero == null ? 1 : zero);
var f = clamp(z * R / (R + Math.max(0, Rx)) + mechOffset(screw), 1e-4, 1.02);
return MID * (1 - f) / f * mult;
}

var SP = shuntPair(IA, IB);
var VT = voltTaps([U1, U2]);
var POS = [
{ pos: 0, key: 'off', short: 'OFF', label: 'OFF（断开）', kind: 'off',
note: '开关断开：表头不与任何外围接通，全表无电流、指针不动', path: '—' },
{ pos: 1, key: 'i100', short: '① 100 mA', label: '直流电流 100 mA', kind: 'A', range: IA,
note: '电流从 A 进 → 表头与 Ra 并联（Rb 与表头串联）→ 抽头 → ① → B', path: 'A → (G+Rb) ∥ Ra → ① → B',
vals: { Ra: SP.Ra, Rb: SP.Rb } },
{ pos: 2, key: 'i10', short: '② 10 mA', label: '直流电流 10 mA', kind: 'A', range: IB,
note: '电流从 A 进 → 表头与 Ra+Rb 全并联 → ② → B', path: 'A → G ∥ (Ra+Rb) → ② → B',
vals: { S: SP.S } },
{ pos: 3, key: 'o100', short: '③ Ω×100', label: '欧姆 ×100', kind: 'ohm', mult: M1,
note: '表内电池 E1 经黑笔出、红笔回：电池 + → 黑笔 → Rx → 红笔 → 表头 → R₀ → ③ → B', path: 'E1 → 黑笔 → Rx → 红笔 → G → R₀ → ③',
vals: { E: E1, R0: ohmR0(M1), Rint: ohmRint(M1) } },
{ pos: 4, key: 'o1k', short: '④ Ω×1k', label: '欧姆 ×1k', kind: 'ohm', mult: M2,
note: '×1k 换 15 V 叠层电池，R内 15 kΩ；其余同 ③', path: 'E2 → 黑笔 → Rx → 红笔 → G → R₀′ → ④',
vals: { E: E2, R0: ohmR0(M2), Rint: ohmRint(M2) } },
{ pos: 5, key: 'v25', short: '⑤ 2.5 V', label: '直流电压 2.5 V', kind: 'V', U: U1,
note: 'A → 表头 → 串 Rs1 → ⑤ → B，并联在被测两点', path: 'A → G → Rs1 → ⑤ → B',
vals: { Rs1: VT[0].total, RV: VT[0].RV } },
{ pos: 6, key: 'v10', short: '⑥ 10 V', label: '直流电压 10 V', kind: 'V', U: U2,
note: 'A → 表头 → 串 Rs1+Rs2 → ⑥ → B，并联在被测两点', path: 'A → G → Rs1 → Rs2 → ⑥ → B',
vals: { Rs1: VT[0].total, Rs2: VT[1].seg, RV: VT[1].RV } }
];
function branchOf(pos) { return POS[pos] || POS[0]; }

var EL = ['G', 'Ra', 'Rb', 'E1', 'R0a', 'E2', 'Rs_a', 'R0b', 'Rs1', 'Rs2', 'A', 'B', 'wiper'];
function isActive(pos, el) {
var k = branchOf(pos).kind, p = branchOf(pos).pos;
if (k === 'off') { return false; }
if (el === 'G' || el === 'A' || el === 'B' || el === 'wiper') { return true; }
if (el === 'Ra') { return p === 1 || p === 2; }
if (el === 'Rb') { return p === 1 || p === 2; }
if (el === 'E1' || el === 'R0a') { return p === 3; }
if (el === 'E2' || el === 'Rs_a' || el === 'R0b') { return p === 4; }
if (el === 'Rs1') { return p === 5 || p === 6; }
if (el === 'Rs2') { return p === 6; }
return false;
}

var GEO = {
L: [99, 108], R: [272, 108], Gc: [185, 108], Gr: 20,
rowY: 169, RaL: 127, RaR: 171, RbL: 207, RbR: 250, tapX: 189,

cv.height = Math.floor(h * dpr);
cv.style.width = w + 'px';
cv.style.height = h + 'px';
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
return true;
}

/* ===================== 状态派生 ===================== */
function derive() {
st.phase = phaseAcc;
var rows = st.rows || [];
var hasOhm = false, hasUni = false, i;
for (i = 0; i < rows.length; i++) { if (rows[i].type === 'ohm') { hasOhm = true; } else { hasUni = true; } }
st.mode = (hasOhm && !hasUni) ? 'ohm' : 'V';
if (st.mode === 'ohm') {
var m = st.mult || 100;
var rx = st.rx == null ? P.ohmRint(m) : st.rx;
st.fShow = P.ohmFrac(rx, m, st.zero == null ? 1 : st.zero);
} else {
st.fShow = st.needle == null ? 0.5 : st.needle;
}
st.Ima = st.fShow;
st.Uma = st.fShow * P.UG;
/* 表盘读数面板 */
var d = S.panelOf(st);
st.dialLines = d.lines || [];
st.dialNotes = d.notes || [];
st.panel = d;
st.readTxt = d.total || '—';
return st;
}

/* ===================== 右栏 ===================== */
function rowHTML(list) {
var h = '', i, v, cls;
if (!list) { return h; }
for (i = 0; i < list.length; i++) {
v = list[i];
cls = v[2] || '';
h += '<div class="rd"><span>' + esc(v[0]) + '</span><b class="' + esc(cls) + '">' + esc(v[1]) + '</b></div>';
}
return h;
}
function updatePanel() {
document.getElementById('p1').innerHTML = rowHTML(st.panel.p1);
document.getElementById('p2').innerHTML = rowHTML(st.panel.p2);
document.getElementById('rdTotal').textContent = st.panel.total || '—';
document.getElementById('rdFormula').textContent = st.formula || '—';
document.getElementById('rdNote').innerHTML = st.note || '';
var rulePane = document.getElementById('rulePane');
var rs = st.panel.rules || [];
rulePane.classList.toggle('hidden', rs.length === 0);
var rh = '', i;
for (i = 0; i < rs.length; i++) { rh += '<div>' + esc(rs[i]) + '</div>'; }
document.getElementById('rules').innerHTML = rh;
var fp = document.getElementById('fillPane');
var on = st.allow.indexOf('fill') >= 0;
fp.classList.toggle('hidden', !on);
if (on) { ensureFillFields(); syncFillMsgs(); }
}
var FILL_ORDER = ['v_series', 'v_formula', 'a_series', 'a_formula'];
function ensureFillFields() {
var host = document.getElementById('fillFields');
if (host.dataset.built) { return; }
var h = '', i, k;
for (i = 0; i < FILL_ORDER.length; i++) {
k = FILL_ORDER[i];
h += '<div class="fillrow"><label>' + esc(S.FILL[k].label) + '</label>' +
'<input id="fi_' + k + '" type="text" autocomplete="off" spellcheck="false" placeholder="填在这里">' +
'<div class="fmsg" id="fm_' + k + '"></div></div>';
}
host.innerHTML = h;
host.dataset.built = '1';
}
function syncFillMsgs() {
var i, k, r, el;
for (i = 0; i < FILL_ORDER.length; i++) {
k = FILL_ORDER[i];
el = document.getElementById('fm_' + k);
if (!el) { continue; }
r = fillRes[k];
if (r) { el.className = 'fmsg ' + (r.ok ? 'ok' : 'bad'); el.textContent = r.msg; }
else { el.className = 'fmsg'; el.textContent = ''; }
}
}
function checkFillAll() {
var i, k, inp;
for (i = 0; i < FILL_ORDER.length; i++) {
k = FILL_ORDER[i];
inp = document.getElementById('fi_' + k);
fillRes[k] = S.checkFill(k, inp ? inp.value : '');
}
st.fillResult = { ok: fillRes.v_series.ok && fillRes.v_formula.ok && fillRes.a_series.ok && fillRes.a_formula.ok };
syncFillMsgs();
draw();
}

/* ===================== 底栏控件 ===================== */
function ctrlVal(k) { return (k === 'f') ? st.fManual : st[k]; }
function setCtrl(k, v) { if (k === 'f') { st.fManual = v; } else { st[k] = v; } }
function fmtVal(k, v) {
var rg = S.REG[k] || {};
switch (rg.fmt) {
case 'pct': return Math.round(v * 100) + '%';
case 'ohm': return fmtOhm(v);
case 'zero': return v >= 0.98 ? '已调零' : Math.round(v * 100) + '%';
case 'volt': return P.fmt(v, 2) + ' V';
case 'amp': return (v * 1000).toFixed(v < 0.02 ? 1 : 0) + ' mA';
case 'fnum': return Number(v).toFixed(2);
case 'screw': return Math.abs(v) < 0.02 ? '居中' : (v > 0 ? '偏右 ' : '偏左 ') + Math.round(Math.abs(v) * 100) + '%';
case 'stage': return Math.round(v) + ' / 5';
default: return String(v);
}
}
function makeCtrl(k) {
var rg = S.REG[k], box = document.createElement('div'), i;
if (rg.type === 'range') {
box.className = 'slider';
box.dataset.k = k;
var span = document.createElement('span');
span.textContent = rg.label;
var inp = document.createElement('input');
inp.type = 'range';
var b = document.createElement('b');
inp.addEventListener('input', function () {
var v = parseFloat(inp.value);
setCtrl(k, v);
draw();
});
box.appendChild(span); box.appendChild(inp); box.appendChild(b);
return box;
}
if (rg.type === 'buttons') {
box.className = 'grp';
box.dataset.k = k;
var lab = document.createElement('span');
lab.className = 'lab';
lab.textContent = rg.label;
box.appendChild(lab);
for (i = 0; i < rg.opts.length; i++) {
var btn = document.createElement('button');
btn.className = 'ghost';
btn.dataset.k = k;
btn.dataset.v = String(rg.opts[i][0]);
btn.textContent = rg.opts[i][1];
box.appendChild(btn);
}
box.addEventListener('click', function (e) {
var b2 = e.target.closest ? e.target.closest('button[data-v]') : null;
if (!b2) { return; }
var raw = b2.dataset.v, num = parseFloat(raw);
setCtrl(k, (String(num) === raw && raw !== '') ? num : raw);
draw();
});
return box;
}
box.className = 'grp hidden';
return box;
}
function syncCtrl(k) {
var rg = S.REG[k];
var box = document.querySelector('#ctrls [data-k="' + k + '"]');
if (!box) { return; }
if (rg.type === 'range') {
var inp = box.querySelector('input'), b = box.querySelector('b');
var spec = (rg.rng && st.rng && st.rng[k]) ? st.rng[k] : [rg.min, rg.max, rg.step];
inp.min = spec[0]; inp.max = spec[1]; inp.step = spec[2];
inp.value = ctrlVal(k);
b.textContent = fmtVal(k, ctrlVal(k));
} else if (rg.type === 'buttons') {
var bs = box.querySelectorAll('button[data-v]'), i;
for (i = 0; i < bs.length; i++) { bs[i].classList.toggle('on', String(bs[i].dataset.v) === String(ctrlVal(k))); }
}
}
function buildControls() {
var host = document.getElementById('ctrls');
var keys = [], i;
for (i = 0; i < S.ORDER.length; i++) {
var k = S.ORDER[i];
if (st.allow.indexOf(k) >= 0 && S.REG[k] && S.REG[k].type !== 'panel') { keys.push(k); }
}
var sig = st.step + '|' + keys.join(',') + '|' + JSON.stringify(st.rng || {});
if (host.dataset.sig !== sig) {
host.innerHTML = '';
host.dataset.sig = sig;
for (i = 0; i < keys.length; i++) { host.appendChild(makeCtrl(keys[i])); }
}
for (i = 0; i < keys.length; i++) { syncCtrl(keys[i]); }
var lab = document.getElementById('dragLab');
var map = {
needle: '画布上左右拖动 = 拨动指针',
rx: '画布上左右拖动 = 改变被测电阻 Rx',
zero: '画布上左右拖动 = 拧欧姆调零 R₀',
U: '画布上左右拖动 = 改变电压量程 U',
I: '画布上左右拖动 = 改变电流量程 I',
rg: '画布上左右拖动 = 改变表头内阻 Rg',
f: '画布上左右拖动 = 移动偏转比 f',
screw: '画布上左右拖动 = 旋机械调零螺丝',
stage: '画布上左右拖动 = 推进推导链'
};
lab.textContent = map[st.dragKey] || (st.allow.length ? '用底栏控件改变量，看画面怎么跟着变' : '本屏是结论屏：不需要拖动');
lab.classList.toggle('dim', !st.dragKey);
}

/* ===================== 顶部导航 ===================== */
function buildToc() {
var nav = document.getElementById('toc'), html = '', lastAct = '', i, d;
for (i = 0; i < S.STEPS.length; i++) {
d = S.STEPS[i];
if (d.act !== lastAct) {
if (lastAct) { html += '<span class="sep"></span>'; }
html += '<span class="grouplab">' + esc(String(d.act).split(' · ')[0]) + '</span>';
lastAct = d.act;
}
html += '<a data-go="' + i + '" title="' + esc(d.title) + '">' + (i + 1) + '</a>';
}
nav.innerHTML = html;
nav.addEventListener('click', function (e) {
var a = e.target.closest ? e.target.closest('a[data-go]') : null;
if (a) { goto(parseInt(a.dataset.go, 10)); }
});
}
function markToc() {
var as = document.querySelectorAll('#toc a'), i;
for (i = 0; i < as.length; i++) { as[i].classList.toggle('on', parseInt(as[i].dataset.go, 10) === st.step); }
}

/* ===================== 绘制 ===================== */
function draw() {
derive();
fitCanvas();
R.draw(ctx, W, H, st);
updatePanel();
markToc();
buildControls();
document.getElementById('actTag').textContent = String(st.act).split(' · ')[0];
document.getElementById('stepTitle').textContent = st.title;
document.getElementById('stepSn').textContent = (st.step + 1) + ' / ' + S.STEPS.length;
document.getElementById('hint').innerHTML = st.hint || '';
document.getElementById('prog').firstElementChild.style.width = ((st.step + 1) / S.STEPS.length * 100) + '%';
}

/* ===================== 步骤机 ===================== */
function goto(i) {
S.apply(st, i);
fillRes = {};
var host = document.getElementById('fillFields');
if (host && host.dataset.built) {
var inps = host.querySelectorAll('input');
for (var k = 0; k < inps.length; k++) { inps[k].value = ''; }
}
draw();
}
function next() { if (st.step < S.STEPS.length - 1) { goto(st.step + 1); } }
function prev() { if (st.step > 0) { goto(st.step - 1); } }

/* ===================== 交互 ===================== */
function bind() {
document.getElementById('btnPrev').onclick = prev;
document.getElementById('btnNext').onclick = next;
document.getElementById('btnReset').onclick = function () { goto(st.step); };
document.getElementById('btnFillCheck').onclick = checkFillAll;

cv.addEventListener('pointerdown', function (e) {
if (!st.dragKey) { return; }
drag = { x: e.clientX, key: st.dragKey };
cv.setPointerCapture(e.pointerId);
cv.style.cursor = 'grabbing';
});
cv.addEventListener('pointermove', function (e) {
if (!drag) { return; }
var dx = e.clientX - drag.x;
drag.x = e.clientX;
var per = dx / Math.max(120, W - 100), k = drag.key, rg = S.REG[k] || {};
var spec = (rg.rng && st.rng && st.rng[k]) ? st.rng[k] : [rg.min, rg.max, rg.step];
var v = ctrlVal(k) + per * (spec[1] - spec[0]) * 0.6;
v = Math.max(spec[0], Math.min(spec[1], v));
if (k === 'stage') { v = Math.round(v); }
setCtrl(k, v);
draw();
});
cv.addEventListener('pointerup', function () { drag = null; cv.style.cursor = 'grab'; });
cv.addEventListener('pointercancel', function () { drag = null; });
cv.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });

document.addEventListener('keydown', function (e) {
if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) { return; }
if (e.key === 'ArrowRight') { next(); }
if (e.key === 'ArrowLeft') { prev(); }
if (e.key === 'Home') { goto(0); }
if (e.key === 'End') { goto(S.STEPS.length - 1); }
});

function loop(t) {
var dt = lastT ? Math.min(60, t - lastT) : 16;
lastT = t;
phaseAcc += dt / 1000;
if (st.view === 'final' || st.view === 'ohmCircuit' || st.view === 'wire') { draw(); }
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}

/* ===================== 自检 ===================== */
function hash() {
var keep = phaseAcc;
phaseAcc = 0; st.phase = 0;
derive();
fitCanvas();
R.draw(ctx, W, H, st);
var d = ctx.getImageData(0, 0, cv.width, cv.height).data;
phaseAcc = keep;
var h = 2166136261, i;
for (i = 0; i < d.length; i += 97) { h ^= d[i]; h = (h * 16777619) >>> 0; }
return h;
}

function selfTest() {
var phys = P.selfTest();
var errs = phys.errs.slice(), cases = phys.cases;
function chk(name, cond) { cases++; if (!cond) { errs.push(name); } }
var i, j, k, d;

/* 1. 结构 */
chk('八幕 33 步', S.STEPS.length === 33 && S.ACTS.length === 8);
var acts = {};
for (i = 0; i < S.STEPS.length; i++) { acts[String(S.STEPS[i].act).split(' · ')[0]] = 1; }
chk('幕标签共 8 个', Object.keys(acts).length === 8);

/* 2. allow 只能出现登记过的控件；dragKey 必须在 allow 里 */
for (i = 0; i < S.STEPS.length; i++) {
d = S.STEPS[i];
var al = d.allow || [];
for (j = 0; j < al.length; j++) { if (!S.REG[al[j]]) { errs.push('第 ' + (i + 1) + ' 步 allow 含未登记控件 ' + al[j]); } }
if (d.dragKey && al.indexOf(d.dragKey) < 0) { errs.push('第 ' + (i + 1) + ' 步 dragKey=' + d.dragKey + ' 不在 allow 里'); }
}

/* 3. hint 说了能拖/能点的，allow 里必须有（按控件标签比对） */
for (i = 0; i < S.STEPS.length; i++) {
d = S.STEPS[i];
var ms = String(d.hint || '').match(/「[^」]+」/g) || [];
for (j = 0; j < ms.length; j++) {
var name = ms[j].replace(/[「」]/g, '');
for (k in S.REG) {
if (Object.prototype.hasOwnProperty.call(S.REG, k) && S.REG[k].label === name && (d.allow || []).indexOf(k) < 0) {
errs.push('第 ' + (i + 1) + ' 步 hint 提到「' + name + '」但 allow 里没有 ' + k);
}
}
}
}

/* 4. 每步都能算出有限读数，面板无 NaN/undefined，标题齐全 */
var save = JSON.stringify({ step: st.step });
for (i = 0; i < S.STEPS.length; i++) {
S.apply(st, i);
derive();
if (!isFinite(st.fShow) || st.fShow < -0.01 || st.fShow > 1.03) { errs.push('第 ' + (i + 1) + ' 步偏转比越界：' + st.fShow); }
if (!st.headline || !st.tag || !st.conclusion) { errs.push('第 ' + (i + 1) + ' 步缺少 headline/tag/conclusion'); }
var blob = JSON.stringify(st.panel);
if (blob.indexOf('NaN') >= 0 || blob.indexOf('undefined') >= 0 || blob.indexOf('null') >= 0) { errs.push('第 ' + (i + 1) + ' 步面板出现 NaN/undefined/null'); }
if (st.readTxt === '—' || st.readTxt == null) { errs.push('第 ' + (i + 1) + ' 步读数为空'); }
}

/* 4b. 无状态泄漏：正序 / 逆序各算一遍，同一步的面板必须逐字一致 */
var fwdSnap = [], backSnap = [];
for (i = 0; i < S.STEPS.length; i++) { S.apply(st, i); derive(); fwdSnap.push(JSON.stringify(st.panel)); }
for (i = S.STEPS.length - 1; i >= 0; i--) { S.apply(st, i); derive(); backSnap.unshift(JSON.stringify(st.panel)); }
for (i = 0; i < S.STEPS.length; i++) {
if (fwdSnap[i] !== backSnap[i]) { errs.push('第 ' + (i + 1) + ' 步面板随访问顺序变化（状态泄漏）'); }
}
chk('正序/逆序面板完全一致（无状态残留）', true);

/* 5. 结论屏 allow 为空 */
chk('第 11 步（回扣需求结论屏）allow 为空', (S.STEPS[10].allow || []).length === 0);

/* 6. 关键屏存在 */
var iFinal = -1, iLab = -1, iTapsA = -1, iDial = -1, iOps = -1, iWire = -1;
for (i = 0; i < S.STEPS.length; i++) {
d = S.STEPS[i];
if (d.view === 'final') { iFinal = i; }
if (d.view === 'lab' && (d.allow || []).indexOf('objId') >= 0 && (d.allow || []).indexOf('pos') >= 0) { iLab = i; }
if (d.view === 'tapsA') { iTapsA = i; }
if (d.view === 'dial' && String(d.title).indexOf('课本 11.5') >= 0) { iDial = i; }
if (d.view === 'ops') { iOps = i; }
if (d.view === 'wire') { iWire = i; }
}
chk('有「最终电路图」步且能转开关', iFinal >= 0 && (S.STEPS[iFinal].allow || []).indexOf('pos') >= 0);
chk('有「抽头式两量程电流表」步', iTapsA >= 0 && (S.STEPS[iTapsA].allow || []).indexOf('tap') >= 0);
chk('有「课本 11.5 表盘」步', iDial >= 0 && (S.STEPS[iDial].allow || []).indexOf('needle') >= 0);
chk('有「六步操作单」步', iOps >= 0);
chk('有「图↔物」步', iWire >= 0 && (S.STEPS[iWire].allow || []).indexOf('hoverWire') >= 0);
chk('有「真实使用」步且能选对象与挡位', iLab >= 0 && (S.STEPS[iLab].allow || []).indexOf('objId') >= 0 && (S.STEPS[iLab].allow || []).indexOf('pos') >= 0);

/* 7. 原理图与档位一致（isActive 抽查） */
chk('原理图：①②档 R₁/R₂ 亮、③④档电池亮、⑤⑥档串阻亮',
P.isActive(1, 'Ra') && P.isActive(2, 'Rb') && P.isActive(3, 'E1') && P.isActive(4, 'E2') && P.isActive(5, 'Rs1') && P.isActive(6, 'Rs2') && !P.isActive(0, 'G'));
chk('原理图：OFF 全灭', (function () { for (var q = 0; q < P.EL.length; q++) { if (P.isActive(0, P.EL[q])) { return false; } } return true; })());
chk('原理图：导线高亮规则与元件高亮一致（逐档）', (function () {
var segs = ['Ra', 'Rb', 'tap1', 'to2', 'E1top', 'E1bot', 'to3', 'E2top', 'E2bot', 'to4', 'Rs1', 'Rs2', 'to5', 'to6'];
var map = { Ra: 'Ra', Rb: 'Rb', tap1: null, to2: null, E1top: 'E1', E1bot: 'E1', to3: null, E2top: 'E2', E2bot: 'E2', to4: null, Rs1: 'Rs1', Rs2: 'Rs2', to5: null, to6: null };
for (var q = 0; q <= 6; q++) {
for (var s2 = 0; s2 < segs.length; s2++) {
var el = map[segs[s2]];
if (el && P.lit(segs[s2], q) !== P.isActive(q, el)) { return false; }
}
if (q === 0 && (P.lit('A', q) || P.lit('G', q))) { return false; }
if (q > 0 && !P.lit('A', q)) { return false; }
}
return true;
})());
chk('原理图：每档导通折线首尾都落在 A/B 笔上', (function () {
for (var q = 1; q <= 6; q++) {
var pa = P.pathOf(q);
if (!pa.length) { return false; }
var head = pa[0], tail = pa[pa.length - 1];
if (Math.abs(head[0] - P.GEO.L[0]) > 0.5) { return false; }
if (Math.abs(tail[0] - P.GEO.pivot[0]) > 0.5) { return false; }
}
return true;
})());

/* 8. 课本表盘四排 */
chk('课本表盘 = Ω 尺 + 三排均匀尺（250/50/10）', (function () {
var rs = S.rowsTextbook();
return rs.length === 4 && rs[0].type === 'ohm' && rs[1].max === 250 && rs[2].max === 50 && rs[3].max === 10;
})());

/* 9. 分度白名单 */
var dts = Object.keys(P.DIV_TABLE);
for (i = 0; i < dts.length; i++) { chk('DIV_TABLE[' + dts[i] + '] 分度整齐', P.checkDiv(P.DIV_TABLE[dts[i]][0])); }

/* 10. 填空判分 */
chk('填空：串并写反被判错', S.checkFill('v_series', '并').ok === false && /串并写反/.test(S.checkFill('v_series', '并').msg));
chk('填空：电流表串并写反被判错', S.checkFill('a_series', '串').ok === false);
chk('填空：分子分母写反被判错', S.checkFill('v_formula', 'R = U/(Ig − Rg)').ok === false);
chk('填空：正确答案判对', S.checkFill('v_series', '串').ok === true && S.checkFill('a_series', '并联').ok === true && S.checkFill('v_formula', 'R = U/Ig − Rg').ok === true && S.checkFill('a_formula', 'R = IgRg/(I − Ig)').ok === true);

/* 11. 六步顺序 */
chk('六步末步是复位', P.SIX_STEPS.length === 6 && P.SIX_STEPS[5].id === 'reset');

/* 12. 关键数字不漂移（第四版口径） */
chk('2.5 V 挡 = 2400 Ω、10 V 挡 = 9900 Ω', P.near(P.seriesR(2.5), 2400) && P.near(P.seriesR(10), 9900));
chk('R₁ = 1.1111 Ω、R₂ = 10 Ω', P.near(P.SP.Ra, 1.111111, 1e-5) && P.near(P.SP.Rb, 10, 1e-6));

var back = JSON.parse(save);
S.apply(st, back.step);
return { pass: errs.length === 0, errs: errs, cases: cases, steps: S.STEPS.length, phys: phys.cases };
}

window.__viz = {
selfTest: selfTest, hash: hash, goto: goto, next: next, prev: prev,
state: st, steps: S.STEPS.length, draw: draw, derive: derive, physics: P, panel: S.panelOf
};

buildToc();
goto(0);
bind();
window.addEventListener('resize', function () { draw(); });
})();

</script>
</body>
