<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多用电表的设计与使用 · 从一只表头开始</title>
<style>
  /* C 基调 · 白底实物风格（风格与技术路线.md v4.0） */
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,'Microsoft YaHei','PingFang SC',sans-serif;
    background:linear-gradient(135deg,#f5f7fa 0%,#e4edf9 100%);
    color:#333; overflow:hidden;
  }
  .app{display:grid;grid-template-rows:auto auto 1fr auto auto;height:100vh;padding:8px 12px 10px;gap:7px;}
  header{background:rgba(255,255,255,.95);border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);padding:8px 16px;display:flex;align-items:center;gap:12px;
    flex-wrap:nowrap;height:44px;flex:0 0 auto;overflow:hidden;}
  header h1{font-size:1rem;color:#2c3e50;font-weight:600;white-space:nowrap;}
  .act{font-size:.74rem;color:#3498db;background:#eef5fd;border:1px solid #d7e5f7;border-radius:20px;padding:2px 10px;white-space:nowrap;}
  .steptitle{font-size:.88rem;color:#37474f;font-weight:600;flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stepsn{flex:0 0 auto;margin-left:auto;font-size:.8rem;color:#90a4ae;font-variant-numeric:tabular-nums;}
  .topnav{display:flex;align-items:center;gap:4px;padding:5px 10px;overflow-x:auto;overflow-y:hidden;
    background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .topnav .grouplab{flex:0 0 auto;font-size:.68rem;letter-spacing:.3px;color:#90a4ae;font-weight:600;white-space:nowrap;}
  .topnav .sep{flex:0 0 auto;width:1px;height:14px;background:#e0e7ef;margin:0 4px;}
  .topnav a{flex:0 0 auto;min-width:24px;height:21px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;
    font-size:.74rem;font-variant-numeric:tabular-nums;color:#546e7a;background:#f8fafd;
    border:1px solid #e0e7ef;border-radius:6px;cursor:pointer;text-decoration:none;}
  .topnav a:hover{border-color:#3498db;background:#f1f7ff;}
  .topnav a.on{background:#3498db;border-color:#3498db;color:#fff;font-weight:700;}
  .stage{display:grid;grid-template-columns:1fr 302px;gap:7px;min-height:0;}
  .canvaswrap{position:relative;min-width:0;min-height:0;padding:5px;background:#fff;border-radius:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none;
    background:linear-gradient(to bottom,#f0f5fc,#ffffff);border-radius:8px;
    box-shadow:inset 0 0 10px rgba(0,0,0,.08);}
  aside{background:#fff;border-radius:15px;box-shadow:0 8px 25px rgba(0,0,0,.08);
    padding:11px 13px;overflow-y:auto;min-height:0;}
  aside h3{font-size:.74rem;color:#90a4ae;margin:10px 0 5px;font-weight:600;letter-spacing:.3px;}
  aside h3:first-child{margin-top:0;}
  .rd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 0;
    font-size:.78rem;color:#546e7a;border-bottom:1px dashed #e0e7ef;}
  .rd span{white-space:nowrap;}
  .rd b{font-size:.9rem;color:#297fb8;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
    font-family:'Courier New',monospace;}
  .rd b.red{color:#c0392b;} .rd b.green{color:#27ae60;} .rd b.grey{color:#78909c;} .rd b.orange{color:#e67e22;} .rd b.ink{color:#546e7a;}
  .total{margin-top:8px;padding:9px 11px;background:#DCDCDC;border:1px solid #e9f0f9;
    border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,.04);text-align:center;}
  .total .lab{font-size:.72rem;color:#546e7a;display:block;margin-bottom:2px;}
  .total b{font-size:1.55rem;color:#297fb8;font-weight:700;font-family:'Courier New',monospace;
    font-variant-numeric:tabular-nums;}
  .formula{font-size:.8rem;color:#1565c0;background:#eef5fd;border:1px solid #d7e5f7;
    border-radius:8px;padding:8px 10px;line-height:1.6;word-break:break-word;}
  .note{font-size:.78rem;color:#37474f;line-height:1.68;}
  .note b{color:#c0392b;font-weight:600;}
  .rules{display:flex;flex-direction:column;gap:5px;}
  .rules div{font-size:.76rem;color:#37474f;background:#f8fafd;border-left:3px solid #3498db;
    border-radius:0 6px 6px 0;padding:5px 8px;line-height:1.5;}
  .fillrow{margin-bottom:6px;}
  .fillrow label{display:block;font-size:.74rem;color:#546e7a;margin-bottom:3px;}
  .fillrow input{width:100%;font-family:'Courier New',monospace;font-size:.92rem;
    font-variant-numeric:tabular-nums;color:#297fb8;background:#fff;
    border:1px solid #dde2e9;border-radius:8px;padding:6px 9px;outline:none;}
  .fillrow input:focus{border-color:#3498db;}
  .fmsg{font-size:.72rem;margin-top:3px;color:#546e7a;}
  .fmsg.ok{color:#27ae60;} .fmsg.bad{color:#c0392b;}
  .grp{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .grp .lab{font-size:.74rem;color:#90a4ae;white-space:nowrap;}
  button{font-family:inherit;font-size:.76rem;color:#fff;font-weight:500;
    background:#3498db;border:none;border-radius:8px;padding:5px 12px;cursor:pointer;
    white-space:nowrap;transition:all .2s ease;}
  button:hover{background:#2980b9;transform:translateY(-1px);box-shadow:0 4px 8px rgba(52,152,219,.25);}
  button:active{transform:translateY(0);}
  button.ghost{background:#fff;color:#546e7a;border:1px solid #dde2e9;}
  button.ghost:hover{background:#f1f7ff;border-color:#3498db;box-shadow:none;}
  button.on{background:#2980b9;box-shadow:0 0 0 2px rgba(52,152,219,.3);}
  .hint{padding:6px 14px;font-size:.8rem;color:#1565c0;background:rgba(240,248,255,.9);
    border:1px solid #d7e5f7;border-radius:15px;height:32px;flex:0 0 auto;overflow:hidden;
    display:flex;align-items:center;white-space:nowrap;text-overflow:ellipsis;}
  .hint b{color:#3498db;font-weight:600;}
  footer{display:flex;align-items:center;gap:7px;flex-wrap:wrap;row-gap:6px;
    padding:7px 12px;background:#fff;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);}
  #ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:6px;flex:1 1 100%;}
  .bar{position:relative;flex:1 1 90px;min-width:60px;height:8px;background:#e0e7ef;border-radius:4px;}
  .bar i{display:block;height:100%;width:0;background:#3498db;border-radius:4px;transition:width .2s;}
  .slider{display:flex;align-items:center;gap:6px;font-size:.78rem;color:#546e7a;}
  .slider input[type=range]{width:112px;height:8px;background:#e0e7ef;border-radius:4px;
    outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;}
  .slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;
    border-radius:50%;background:#3498db;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .slider input[type=range]::-moz-range-thumb{width:19px;height:19px;border:none;border-radius:50%;
    background:#3498db;cursor:pointer;}
  .slider b{color:#297fb8;font-variant-numeric:tabular-nums;min-width:58px;text-align:right;
    font-family:'Courier New',monospace;}
  #dragLab{font-size:.72rem;color:#90a4ae;}
  #dragLab.dim{opacity:.45;}
  .hidden{display:none !important;}
  @media (max-width:900px){
    .stage{grid-template-columns:1fr;grid-template-rows:1fr auto;}
    aside{max-height:25vh;border-radius:12px;}
    .app{padding:5px 7px 7px;gap:5px;}
    header{height:38px;padding:5px 9px;gap:7px;} header h1{font-size:.78rem;} .steptitle{font-size:.72rem;} .act{font-size:.66rem;padding:1px 7px;}
    .hint{height:42px;white-space:normal;line-height:1.4;font-size:.72rem;padding:5px 9px;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .slider input[type=range]{width:74px;}
    footer{flex-wrap:wrap;} #ctrls{gap:7px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>多用电表 · 设计与使用</h1>
    <span class="act" id="actTag">第 0 幕</span>
    <span class="steptitle" id="stepTitle">—</span>
    <span class="stepsn" id="stepSn">1 / 30</span>
  </header>

  <nav class="topnav" id="toc" aria-label="步骤导航"></nav>

  <div class="stage">
    <div class="canvaswrap"><canvas id="cv"></canvas></div>
    <aside>
      <h3>这一刻的量</h3>
      <div id="p1"></div>
      <h3>这一挡的参数</h3>
      <div id="p2"></div>
      <div class="total"><span class="lab" id="rdTotalLab">本步读数 / 结论</span><b id="rdTotal">—</b></div>

      <div id="fillPane" class="hidden">
        <h3>填一填</h3>
        <div id="fillFields"></div>
        <div class="grp" style="margin-top:6px">
          <button id="btnFillCheck">对答案</button>
        </div>
      </div>

      <div id="rulePane" class="hidden">
        <h3>规则卡</h3>
        <div class="rules" id="rules"></div>
      </div>

      <h3>这一刻的公式</h3>
      <div class="formula" id="rdFormula">—</div>
      <h3>说明</h3>
      <div class="note" id="rdNote"></div>
    </aside>
  </div>

  <div class="hint" id="hint"></div>

  <footer>
    <button id="btnPrev" class="ghost">◀ 上一步</button>
    <button id="btnNext">下一步 ▶</button>
    <button id="btnReset" class="ghost">↺ 复位本步</button>
    <div class="bar" id="prog"><i></i></div>
    <span id="dragLab">—</span>
    <div id="ctrls"></div>
  </footer>
</div>

<script>


window.VizPhys2 = (function () {
'use strict';

var IG = 1e-3;
var RG = 100;
var UG = IG * RG;
var E = 1.5;
var E2 = 9.0;
var DF = 0.004;

var STD_V = [1, 3, 10, 15, 50, 250];
var STD_A = [0.01, 0.1, 0.6, 1, 3, 10];

var DIV_WHITE = [1, 0.1, 0.01, 2, 0.2, 0.02, 5, 0.5, 0.05];

var DIV_TABLE = { '1': [0.02, 50], '3': [0.1, 30], '10': [0.2, 50], '15': [0.5, 30] };
var ROW_V = [250, 50, 10];

var MULT = [1, 10, 100, 1000];
var RINT = { '1': 15, '10': 150, '100': 1500, '1000': 90000 };
var SCALE_MID = { '1': 15, '10': 15, '100': 15, '1000': 90 };

var FIG_RULES = [
{ rule: '横平竖直、转角 90°', why: '斜线、曲线看不出连接关系' },
{ rule: '节点画实心圆点', why: '十字交叉不画点，分不清连没连' },
{ rule: '抽头标字母 A / B / C', why: '只画线不标字母，接线时对不上' },
{ rule: '电流箭头标一次', why: '全图无方向，红黑笔容易接反' },
{ rule: '元件符号规范', why: '表头画成圆圈乱涂，别人看不懂' }
];

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function near(a, b, t) { return Math.abs(a - b) <= (t == null ? 1e-9 : t); }
function fmt(v, n) { return Number(v).toFixed(n == null ? 3 : n).replace(/\.?0+$/, ''); }
function inList(v, list, t) {
for (var i = 0; i < list.length; i++) { if (Math.abs(list[i] - v) <= (t || 1e-9)) { return true; } }
return false;
}

function headState(I, opt) {
opt = opt || {};
var Ig = opt.Ig == null ? IG : opt.Ig;
var Rg = opt.Rg == null ? RG : opt.Rg;
var f = I / Ig;
var reverse = f < -1e-12;
var show = reverse ? 0 : clamp(f, 0, 1);
return {
I: I, f: f, fShow: show, U: I * Rg, times: f,
overload: f > 1 + 1e-9, reverse: reverse,
needle: reverse ? -0.02 : clamp(f, -0.02, 1.02)
};
}

function timesFull(U) { return U / UG; }

function recommendRange(measured, std) {
var i;
for (i = 0; i < std.length; i++) { if (std[i] >= 2 * measured - 1e-12) { return std[i]; } }
return std[std.length - 1];
}
function recommendReason(measured, std) {
var r = recommendRange(measured, std);
return {
range: r,
usable: measured / r,
atMiddle: measured / r >= 0.33 && measured / r <= 0.67,
text: (measured + ' 落在 ' + r + ' 挡的 ' + Math.round(measured / r * 100) + '% 处')
};
}

function seriesR(U, Rg) { return U / IG - (Rg == null ? RG : Rg); }

function shuntR(I, Rg) { return IG * (Rg == null ? RG : Rg) / (I - IG); }

function voltRV(U) { return U / IG; }
function ampRA(I) { var R = shuntR(I); return RG * R / (RG + R); }

function tapR(list) { var out = [], i; for (i = 0; i < list.length; i++) { out.push(seriesR(list[i])); } return out; }
function tapDelta(list) {
var tot = tapR(list), out = [], i;
for (i = 0; i < tot.length; i++) { out.push(i === 0 ? tot[0] : tot[i] - tot[i - 1]); }
return out;
}

function scaleValueOf(f, range) { return clamp(f, -0.02, 1.02) * range; }

function divFamily(div) {
var d = Math.abs(div), m;
if (d === 0) { return null; }
while (d < 1) { d *= 10; }
m = Math.round(d * 1e6) / 1e6;
if (near(m, 1, 1e-6)) { return '十分法'; }
if (near(m, 2, 1e-6)) { return '二分法'; }
if (near(m, 5, 1e-6)) { return '五分法'; }
return null;
}

function checkDiv(div) { return inList(div, DIV_WHITE, 1e-9) && divFamily(div) !== null; }

function estStep(div) {
var fam = divFamily(div);
if (fam === '十分法') { return div / 10; }
if (fam === '二分法') { return div / 2; }
if (fam === '五分法') { return div / 5; }
return div / 5;
}
function decimalsOf(step) {
if (step >= 1) { return 0; }
if (step >= 0.1) { return 1; }
if (step >= 0.01) { return 2; }
return 3;
}
function readUniform(f, range, div) {
var v = clamp(f, 0, 1) * range;
var step = estStep(div), dec = decimalsOf(step);
var q = Math.round(v / step) * step;
return { value: v, shown: q.toFixed(dec), dec: dec, step: step, div: div, family: divFamily(div) };
}
function divOf(range) {
var e = DIV_TABLE[String(range)];
if (e) { return { div: e[0], cells: e[1] }; }

var cand = [1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01, 2, 5, 10, 20, 50], i;
for (i = cand.length - 1; i >= 0; i--) {
if (range / cand[i] >= 20 && range / cand[i] <= 60) { return { div: cand[i], cells: Math.round(range / cand[i]) }; }
}
return { div: range / 50, cells: 50 };
}

function rowValues(f) { return [f * ROW_V[0], f * ROW_V[1], f * ROW_V[2]]; }

function polarity(mode) {
if (mode === 'ohm') {
return {
redHigher: false, blackHigher: true, currentIn: 'red', rule: '红进黑出',
path: ['表内电池正极', '黑表笔', '待测电阻 Rx', '红表笔', '表头 G', '电池负极'],
note: '对外看电流仍从红笔流入表头；对内看电池正极接在黑笔上'
};
}
return {
redHigher: true, blackHigher: false, currentIn: 'red', rule: '红进黑出',
path: ['红表笔（高电势）', '表头 G', '黑表笔（低电势）'],
note: '电流从红表笔流入表头，指针正向偏转'
};
}

function reverseGuard(f) { return { f: f, reverse: f < 0, show: f < 0 ? -0.02 : clamp(f, 0, 1) }; }

function circuitState(opt) {
opt = opt || {};
var n = opt.probes == null ? 2 : opt.probes;
var closed = n >= 2 && !opt.open;
if (!closed) { return { closed: false, I: 0, f: 0, reverse: false, note: '只有一根表笔，回路没闭合' }; }
var hs = headState(opt.swapped ? -Math.abs(opt.I || 0) : (opt.I || 0));
return { closed: true, I: hs.I, f: hs.f, fShow: hs.fShow, reverse: hs.reverse, note: '' };
}

function probePotentials(mode, U, Ebat) {
if (mode === 'ohm') { var e = Ebat == null ? E : Ebat; return { red: 0, black: e }; }
return { red: U || 0, black: 0 };
}

function ohmRint(mult) { return RINT[String(mult)] || 15 * mult; }
function ohmE(mult) { return mult >= 1000 ? E2 : E; }
function ohmIfs(mult) { return ohmE(mult) / ohmRint(mult); }

function ohmHeadEff(mult) {
if (mult === 1 || mult === 10) {
var Rs = shuntR(ohmIfs(mult));
return RG * Rs / (RG + Rs);
}
return RG;
}
function ohmR0(mult) { return ohmRint(mult) - ohmHeadEff(mult); }
function ohmScaleMid(mult) { return SCALE_MID[String(mult)] || 15; }

function ohmFrac(Rx, mult, zero) {
var R = ohmRint(mult), z = (zero == null ? 1 : zero);
return clamp(z * R / (R + Math.max(0, Rx)), 0, 1.02);
}

function ohmScale(f, mid) {
var m = (mid == null ? 15 : mid);
if (f >= 1) { return 0; }
var fp = Math.max(1e-6, f);
var v = m * (1 - fp) / fp;
return v > 1e7 ? Infinity : v;
}
function ohmScaleOf(mult, f) { return ohmScale(f, ohmScaleMid(mult)); }
function ohmScaleGeom(f) { return 15 * (1 - Math.max(1e-6, Math.min(f, 0.999999))) / Math.max(1e-6, Math.min(f, 0.999999)); }

function ohmRead(Rx, mult, zero) {
var f = ohmFrac(Rx, mult, zero);
var sc = ohmScaleOf(mult, f);
return { f: f, scale: sc, read: sc * mult, mult: mult, Rint: ohmRint(mult) };
}

function ohmRxOfF(f, Rint) { return Rint * (1 - f) / f; }

function ohmErr(f) {
var fp = clamp(f, 0.004, 0.995);
return DF / (fp * (1 - fp));
}
var OHM_SEVEN = [1.0, 0.9, 0.75, 0.5, 0.25, 0.1, 0.02];

function mechOffset(screw) { return clamp(screw, -1, 1) * 0.06; }
function mechRead(Rx, mult, zero, screw) {
var R = ohmRint(mult), z = (zero == null ? 1 : zero);
var f = clamp(z * R / (R + Math.max(0, Rx)) + mechOffset(screw), 1e-4, 1.02);
return ohmScaleMid(mult) * (1 - f) / f * mult;
}

var WIRE_MAP = {
V: [
{ fig: 'A(公共端) → 表头 G', phys: '⑥红笔插孔 → ①表头 + 端子', label: 'A' },
{ fig: 'G → R1 前端', phys: '①表头 − 端子 → ②R1 左端', label: 'G-R1' },
{ fig: 'R1 后端 → B(3 V 抽头)', phys: '②R1 右端 → 抽头 B', label: 'B' },
{ fig: 'R1 后端 → R2 → C(10 V 抽头)', phys: '②R1 右端 → ③R2 → 抽头 C', label: 'C' },
{ fig: '黑笔 → B 或 C', phys: '⑦黑笔 → 抽头 B / C（按量程选）', label: '黑-抽头' },
{ fig: '被测两点之间并上 A 与抽头', phys: '被测两点 → A 与所选抽头（并联）', label: '并联' }
],
A: [
{ fig: 'A(公共端) → 分流电阻 R3 一端', phys: '⑥红笔 → ③R3 一端', label: 'A' },
{ fig: 'R3 另一端 → B', phys: '③R3 另一端 → 抽头 B', label: 'B' },
{ fig: '表头 G 跨接在 A 与 B 之间', phys: '①表头 跨接 A-B（与 R3 并联）', label: 'G∥R3' },
{ fig: '被测电路 → A（串进回路）', phys: '被测电路断开处 → A', label: '串联入' },
{ fig: '被测电路另一端 → B', phys: '被测电路另一端 → B', label: '串联出' },
{ fig: '红笔在 A，黑笔在 B', phys: '⑥红笔 A · ⑦黑笔 B（红进黑出）', label: '红进黑出' }
],
ohm: [
{ fig: '电池 E 正极 → 黑表笔', phys: '④电池 + → ⑦黑笔', label: 'E+黑' },
{ fig: '黑表笔 → 被测电阻 Rx', phys: '⑦黑笔 → 待测电阻一端', label: '黑-Rx' },
{ fig: 'Rx → 红表笔', phys: '待测电阻另一端 → ⑥红笔', label: 'Rx-红' },
{ fig: '红表笔 → 表头 G', phys: '⑥红笔 → ①表头 + 端子', label: '红-G' },
{ fig: 'G → 调零电阻 R0', phys: '①表头 − 端子 → ②R0', label: 'G-R0' },
{ fig: 'R0 → 电池 E 负极（回路闭合）', phys: '②R0 → ④电池 −（回路闭合）', label: 'R0-E-' }
]
};
function wireMap(kind) { var m = WIRE_MAP[kind === 'A' ? 'A' : (kind === 'ohm' ? 'ohm' : 'V')]; return m.slice(); }

function apply(st, i) {

for (k in d) {

}
st.step = i;
st.allow = d.allow || [];
st.rng = d.rng || {};
if (d.init) { d.init(st); }
if (!st.rows) { st.rows = []; }
return st;
}

function panelOf(st) {

function markToc() {
var as = document.querySelectorAll('#toc a'), i;
for (i = 0; i < as.length; i++) { as[i].classList.toggle('on', parseInt(as[i].dataset.go, 10) === st.step); }
}

/* ===================== 绘制 ===================== */
function draw() {
derive();
fitCanvas();
R.draw(ctx, W, H, st);
updatePanel();
markToc();
buildControls();
document.getElementById('actTag').textContent = String(st.act).split(' · ')[0];
document.getElementById('stepTitle').textContent = st.title;
document.getElementById('stepSn').textContent = (st.step + 1) + ' / ' + S.STEPS.length;
document.getElementById('hint').innerHTML = st.hint || '';
document.getElementById('prog').firstElementChild.style.width = ((st.step + 1) / S.STEPS.length * 100) + '%';
}

/* ===================== 步骤机 ===================== */
function goto(i) {
S.apply(st, i);
fillRes = {};
var host = document.getElementById('fillFields');
if (host && host.dataset.built) {
var inps = host.querySelectorAll('input');
for (var k = 0; k < inps.length; k++) { inps[k].value = ''; }
}
draw();
}
function next() { if (st.step < S.STEPS.length - 1) { goto(st.step + 1); } }
function prev() { if (st.step > 0) { goto(st.step - 1); } }

/* ===================== 交互 ===================== */
function bind() {
document.getElementById('btnPrev').onclick = prev;
document.getElementById('btnNext').onclick = next;
document.getElementById('btnReset').onclick = function () { goto(st.step); };
document.getElementById('btnFillCheck').onclick = checkFillAll;

cv.addEventListener('pointerdown', function (e) {
if (!st.dragKey) { return; }
drag = { x: e.clientX, key: st.dragKey };
cv.setPointerCapture(e.pointerId);
cv.style.cursor = 'grabbing';
});
cv.addEventListener('pointermove', function (e) {
if (!drag) { return; }
var dx = e.clientX - drag.x;
drag.x = e.clientX;
var per = dx / Math.max(120, W - 100), k = drag.key, rg = S.REG[k] || {};
var spec = (rg.rng && st.rng && st.rng[k]) ? st.rng[k] : [rg.min, rg.max, rg.step];
if (k === 'mult') {
var list = P.MULT, idx = list.indexOf(st.mult);
if (dx > 24 && idx < 3) { st.mult = list[idx + 1]; st.zero = 0.62; drag.x = e.clientX + 999; }
if (dx < -24 && idx > 0) { st.mult = list[idx - 1]; st.zero = 0.62; drag.x = e.clientX - 999; }
} else {
var v = ctrlVal(k) + per * (spec[1] - spec[0]) * 0.6;
v = Math.max(spec[0], Math.min(spec[1], v));
if (k === 'rx' && v < spec[0] + spec[1] * 0.005) { v = 0; }
setCtrl(k, v);
}
draw();
});
cv.addEventListener('pointerup', function () { drag = null; cv.style.cursor = 'grab'; });
cv.addEventListener('pointercancel', function () { drag = null; });
cv.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });

document.addEventListener('keydown', function (e) {
if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) { return; }
if (e.key === 'ArrowRight') { next(); }
if (e.key === 'ArrowLeft') { prev(); }
if (e.key === 'Home') { goto(0); }
if (e.key === 'End') { goto(S.STEPS.length - 1); }
});

function loop(t) {
var dt = lastT ? Math.min(60, t - lastT) : 16;
lastT = t;
phaseAcc += dt / 1000;
if (st.view === 'probe' || st.view === 'ohmCircuit' || st.view === 'wire') { draw(); }
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}

/* ===================== 自检 ===================== */
function hash() {
/* 像素指纹：动画相位归零后重绘，保证前进/后退逐字节一致 */
var keep = phaseAcc;
phaseAcc = 0; st.phase = 0;
derive();
fitCanvas();
R.draw(ctx, W, H, st);
var d = ctx.getImageData(0, 0, cv.width, cv.height).data;
phaseAcc = keep;
var h = 2166136261, i;
for (i = 0; i < d.length; i += 97) { h ^= d[i]; h = (h * 16777619) >>> 0; }
return h;
}

function selfTest() {
var phys = P.selfTest();
var errs = phys.errs.slice(), cases = phys.cases;
function chk(name, cond) { cases++; if (!cond) { errs.push(name); } }
var i, j, k, d;

/* 1. 结构 */
chk('八幕 31 步', S.STEPS.length === 31 && S.ACTS.length === 8);
var acts = {};
for (i = 0; i < S.STEPS.length; i++) { acts[String(S.STEPS[i].act).split(' · ')[0]] = 1; }
chk('幕标签共 8 个', Object.keys(acts).length === 8);

/* 2. allow 只能出现登记过的控件；dragKey 必须在 allow 里 */
for (i = 0; i < S.STEPS.length; i++) {
d = S.STEPS[i];
var al = d.allow || [];
for (j = 0; j < al.length; j++) { if (!S.REG[al[j]]) { errs.push('第 ' + (i + 1) + ' 步 allow 含未登记控件 ' + al[j]); } }
if (d.dragKey && al.indexOf(d.dragKey) < 0) { errs.push('第 ' + (i + 1) + ' 步 dragKey=' + d.dragKey + ' 不在 allow 里'); }
}

/* 3. hint 说了能拖/能点的，allow 里必须有（按控件标签比对） */
for (i = 0; i < S.STEPS.length; i++) {
d = S.STEPS[i];
var ms = String(d.hint || '').match(/「[^」]+」/g) || [];
for (j = 0; j < ms.length; j++) {
var name = ms[j].replace(/[「」]/g, '');
for (k in S.REG) {
if (Object.prototype.hasOwnProperty.call(S.REG, k) && S.REG[k].label === name && (d.allow || []).indexOf(k) < 0) {
errs.push('第 ' + (i + 1) + ' 步 hint 提到「' + name + '」但 allow 里没有 ' + k);
}
}
}
}

/* 4. 每步都能算出有限读数，面板无 NaN/undefined，标题齐全 */
var save = JSON.stringify({ step: st.step });
for (i = 0; i < S.STEPS.length; i++) {
S.apply(st, i);
derive();
if (!isFinite(st.fShow) || st.fShow < -0.01 || st.fShow > 1.03) { errs.push('第 ' + (i + 1) + ' 步偏转比越界：' + st.fShow); }
if (!st.headline || !st.tag || !st.conclusion) { errs.push('第 ' + (i + 1) + ' 步缺少 headline/tag/conclusion'); }
var blob = JSON.stringify(st.panel);
if (blob.indexOf('NaN') >= 0 || blob.indexOf('undefined') >= 0 || blob.indexOf('null') >= 0) { errs.push('第 ' + (i + 1) + ' 步面板出现 NaN/undefined/null'); }
if (st.readTxt === '—' || st.readTxt == null) { errs.push('第 ' + (i + 1) + ' 步读数为空'); }
if (st.allow.indexOf('fill') >= 0 && !st.fillResult) { /* 填空屏允许未填 */ }
}

/* 4b. 无状态泄漏：正序 / 逆序各算一遍，同一步的面板必须逐字一致 */
var fwdSnap = [], backSnap = [];
for (i = 0; i < S.STEPS.length; i++) { S.apply(st, i); derive(); fwdSnap.push(JSON.stringify(st.panel)); }
for (i = S.STEPS.length - 1; i >= 0; i--) { S.apply(st, i); derive(); backSnap.unshift(JSON.stringify(st.panel)); }
for (i = 0; i < S.STEPS.length; i++) {
if (fwdSnap[i] !== backSnap[i]) { errs.push('第 ' + (i + 1) + ' 步面板随访问顺序变化（状态泄漏）'); }
}
chk('正序/逆序面板完全一致（无状态残留）', true);

/* 5. 结论屏必须 allow 为空（防误加拖拽） */
chk('第 3 步（需求表结论屏）allow 为空', (S.STEPS[2].allow || []).length === 0);
chk('第 29 步（合成降比重）allow 为空', (S.STEPS[28].allow || []).length === 0);
chk('第 29 步文本含"不展开"', /不展开/.test(String(S.STEPS[28].note) + String(S.STEPS[28].headline) + String(S.STEPS[28].conclusion)));

/* 5b. 本次新增的两大功能：大表盘 + 原理图随档位实时对应 */
var iSch = -1, iMech = -1, iMulti = -1, iOps = -1, iDialBook = -1;
for (i = 0; i < S.STEPS.length; i++) {
d = S.STEPS[i];
if (d.view === 'schematic') { iSch = i; }
if (d.view === 'mechZero') { iMech = i; }
if (String(d.title).indexOf('多个档位') >= 0) { iMulti = i; }
if (d.view === 'ops') { iOps = i; }
if (d.view === 'dial' && String(d.title).indexOf('课本 11.5 的表盘') >= 0) { iDialBook = i; }
}
chk('有「完整内部原理图」步且能转开关', iSch >= 0 && (S.STEPS[iSch].allow || []).indexOf('pos') >= 0);
chk('原理图：0~6 每个位置都能算出唯一支路', (function () {
for (var q = 0; q <= 6; q++) { var b = P.branchOf(q); if (!b) { return false; } if (q === 0) { if (b.kind !== 'off') { return false; } } else if (b.pos !== q || !b.kind) { return false; } }
return true;
})());
chk('原理图：每个档位都能给出电流路径（导通支路唯一）', (function () {
for (var q = 1; q <= 6; q++) { var b = P.branchOf(q); if (!b.path || String(b.path).length < 10) { return false; } }
return true;
})());
chk('原理图高亮规则与档位一致（isActive 抽查）', P.isActive(2, 'Rs1') === true && P.isActive(1, 'Rs2') === true && P.isActive(5, 'V串') === true && P.isActive(3, 'E1') === true && P.isActive(4, 'E2') === true && P.isActive(0, 'G') === false);
chk('有「机械调零」步且可旋螺丝', iMech >= 0 && (S.STEPS[iMech].allow || []).indexOf('screw') >= 0 && S.STEPS[iMech].dragKey === 'screw');
chk('机械调零：零点偏 → 读数整体偏（系统偏差 >10%）', (1 - P.mechRead(1500, 100, 1, 1) / 1500) > 0.1 && (P.mechRead(1500, 100, 1, -1) / 1500 - 1) > 0.1);
chk('有「多档设计」步且在量程幕里', iMulti >= 0 && (S.STEPS[iMulti].allow || []).indexOf('tapKind') >= 0 && (S.STEPS[iMulti].allow || []).indexOf('tap') >= 0);
chk('多档：电流四档/电压四档单调且不等', (function () {
var mA = [0.01, 0.1, 0.6, 3], mV = [1, 3, 10, 15], q;
for (q = 1; q < mA.length; q++) { if (!(P.shuntR(mA[q]) < P.shuntR(mA[q - 1]))) { return false; } }
for (q = 1; q < mV.length; q++) { if (!(P.seriesR(mV[q]) > P.seriesR(mV[q - 1]))) { return false; } }
return true;
})());
chk('课本表盘 = Ω 尺 + 三排均匀尺（250/50/10）', (function () {
var rs = S.rowsTextbook();
return rs.length === 4 && rs[0].type === 'ohm' && rs[1].max === 250 && rs[2].max === 50 && rs[3].max === 10;
})());
chk('使用流程步：六步顺序固定且末步是复位', iOps >= 0 && (S.STEPS[iOps].allow || []).indexOf('pos') >= 0 && P.SIX_STEPS.length === 6 && P.SIX_STEPS[5].id === 'reset' && /复位/.test(P.SIX_STEPS[5].title));

/* 6. 勾选状态与已完成量程一致（按步骤应用后的实际状态判） */
S.apply(st, 9);
chk('2.5 步需求表勾 2 行', st.checked === 2 && st.markRule === true);
S.apply(st, 21);
chk('5.5 步需求表勾 3 行', st.checked === 3 && st.markRuleAll === true);
S.apply(st, 28);
chk('6.6 步带"不展开"标记', st.noExpand === true);

/* 7. 分度白名单：DIV_TABLE 里每个分度都属教材三类 */
var dts = Object.keys(P.DIV_TABLE);
for (i = 0; i < dts.length; i++) { chk('DIV_TABLE[' + dts[i] + '] 分度整齐', P.checkDiv(P.DIV_TABLE[dts[i]][0])); }

/* 8. 填空判分能识别两种错 */
chk('填空：串并写反被判错', S.checkFill('v_series', '并').ok === false && /串并写反/.test(S.checkFill('v_series', '并').msg));
chk('填空：电流表串并写反被判错', S.checkFill('a_series', '串').ok === false);
chk('填空：分子分母写反被判错', S.checkFill('v_formula', 'R = U/(Ig − Rg)').ok === false && /分子分母写反/.test(S.checkFill('v_formula', 'R = U/(Ig − Rg)').msg));
chk('填空：正确答案判对', S.checkFill('v_series', '串').ok === true && S.checkFill('a_series', '并联').ok === true && S.checkFill('v_formula', 'R = U/Ig − Rg').ok === true && S.checkFill('a_formula', 'R = IgRg/(I − Ig)').ok === true);

/* 9. 表头参数不漂移 */
chk('表头参数固定 Ig/Rg/Ug', P.IG === 1e-3 && P.RG === 100 && P.near(P.UG, 0.1));
chk('全部步骤的面板里 Rg 只出现 100 Ω（除换参数屏）', (function () {
for (var n = 0; n < S.STEPS.length; n++) {
if (S.STEPS[n].view === 'migrate') { continue; }
S.apply(st, n); derive();
var b = JSON.stringify(st.panel);
if (/Rg\b/.test(b) === false) { continue; }
if (/(9[0-9]|11[0-9])\s*Ω/.test(b)) { return false; }
}
return true;
})());

/* 10. 规则卡：第 4 幕、第 5 幕各步都带规则 */
S.apply(st, 21);
derive();
chk('第 5 幕收束步带 7 张规则卡', (st.panel.rules || []).length === 7);
S.apply(st, 15);
derive();
chk('第 4 幕（欧姆挡表笔）带 2 张规则卡', (st.panel.rules || []).length === 2);
chk('规则卡共 7 张', P.RULES.length === 7);

/* 恢复 */
var back = JSON.parse(save);
S.apply(st, back.step);
return { pass: errs.length === 0, errs: errs, cases: cases, steps: S.STEPS.length, phys: phys.cases };
}

window.__viz = {
selfTest: selfTest, hash: hash, goto: goto, next: next, prev: prev,
state: st, steps: S.STEPS.length, draw: draw, derive: derive, physics: P, panel: S.panelOf
};

buildToc();
goto(0);
bind();
window.addEventListener('resize', function () { draw(); });
})();

</script>
</body>
